services:
  postgres:
    image: postgres:16-alpine
    container_name: pg-limit-test
    ports:
      - "5432:5432"
    volumes:
      - /media/shtirlitz/SSD II/Containers/Docker/postgres:/var/lib/postgresql/data  
      - /mnt/052684cb-2f1c-42ac-a8af-3164d191e25d/_coding_pg/xxDiscovery/2026/2026-11-03-random-access-limits-on-a-huge-dataset/queries:/home/queries
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: logdb
    deploy:
      resources:
        limits:
          memory: 1g
    command: postgres -c shared_buffers=256MB -c max_connections=20 -c work_mem=4MB

  pg-checkpointer:
    image: postgres:16-alpine
    container_name: pg-checkpointer
    depends_on:
      - postgres
    environment:
      PGPASSWORD: password
    entrypoint: >
      sh -c "
      until pg_isready -h postgres -U postgres; do sleep 1; done;
      while true; do
        psql -h postgres -U postgres -d logdb -c 'CALL calculate_next_checkpoints();';
        sleep 5;
      done
      "
