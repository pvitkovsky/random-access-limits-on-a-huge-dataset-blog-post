spring.application.name=db-limit-tester

# Postgres Configuration (active when profile is 'postgres')
spring.datasource.url=jdbc:postgresql://localhost:5432/logdb?reWriteBatchedInserts=true
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=120000

# Loader Configuration (active when profile is 'loader')
loader.records=10000
loader.compression=EXTENDED
loader.body-size=3072

